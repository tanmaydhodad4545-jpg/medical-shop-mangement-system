<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
<link rel="stylesheet" href="style.css">

</head>
<body>
    
<!-- 🏠 DASHBOARD -->
<div class="container" id="homePage">

    <h1>Medical Shop Dashboard</h1>

    <div class="menu">
        <button onclick="showSection('medicine')">Medicine</button>
        <button onclick="showSection('supplier')">Supplier</button>
        <button onclick="showSection('profit and loss')">profit and loss</button>
        <button onclick="showSection('expired')">Expired</button>

         <button id="logoutBtn" onclick="logout()">Logout</button>

    </div>

    <!-- 💊 MEDICINE -->
    <div id="medicine" class="section">
        <h2>Medicine</h2>

        <input type="text" id="medName" placeholder="Name">
        <input type="text" id="medBatch" placeholder="Batch">
        <input type="date" id="medExpiry" lpaceholder="Expiry">
        <input type="number" id="medPrice" placeholder="Price">

        <button onclick="addMedicine()">Add</button>
        
        <button onclick="clearMedicines()">Clear All Medicines</button>
        <table>
            <tr><th>Name</th><th>Batch</th><th>Expiry</th><th>Price</th></tr>
            <tbody id="medTable"></tbody>
        </table>
 </div>
   

<!-- 🚚 SUPPLIER -->
<div id="supplier" class="section">
    <h2>Supplier</h2>

    <input type="text" id="supName" placeholder="Name">
    <input type="text" id="supPhone" placeholder="Phone">
    <input type="text" id="medName" placeholder="Medicine Name">
    <input type="number" id="quantity" placeholder="Quantity">
    <input type="text" id="address" placeholder="Delivery Address">

    <button id="sendBtn">Send</button>

    <table>
        <tr>
            <th>Name</th>
            <th>Phone</th>
            <th>Last Medicine</th>
            <th>Quantity</th>
            <th>Order Count</th>
        </tr>
        <tbody id="supTable"></tbody>
    </table>
</div>

    <!--profit and loss-->
    <div id="profit and loss" class="section">

    </div>
    <!-- ⚠ EXPIRED -->
    <div id="expired" class="section">
    <h2>Expired Medicines</h2>
    <ul id="expiredList"></ul>
</div>


</div>
<script src="script.js"></script>
</body>
</html>
